<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="mWaveCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mWaveViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="mWavePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="mGlowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Scaled content centered within safe zone (80% area) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Ambient Glow -->
    <circle cx="256" cy="256" r="180" fill="url(#mGlowCenter)"/>

    <!-- Concentric Cymatic Vibration Rings -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="2.5"/>
    <circle cx="256" cy="256" r="115" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="14 6"/>
    <circle cx="256" cy="256" r="80" fill="none" stroke="#ec4899" stroke-opacity="0.45" stroke-width="3"/>

    <!-- Geometric Sound Waveforms -->
    <g filter="url(#mGlow)">
      <path d="M 96 256 C 136 176, 176 176, 216 256 C 256 336, 296 336, 336 256 C 376 176, 416 176, 416 256" fill="none" stroke="url(#mWaveCyan)" stroke-width="9" stroke-linecap="round"/>
      <path d="M 120 256 C 154 316, 188 316, 222 256 C 256 196, 290 196, 324 256 C 358 316, 392 316, 392 256" fill="none" stroke="url(#mWaveViolet)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9"/>

      <line x1="256" y1="90" x2="256" y2="140" stroke="url(#mWaveCyan)" stroke-width="7" stroke-linecap="round"/>
      <line x1="256" y1="372" x2="256" y2="422" stroke="url(#mWaveCyan)" stroke-width="7" stroke-linecap="round"/>

      <line x1="210" y1="110" x2="210" y2="145" stroke="url(#mWaveViolet)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
      <line x1="302" y1="110" x2="302" y2="145" stroke="url(#mWaveViolet)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
      <line x1="210" y1="367" x2="210" y2="402" stroke="url(#mWaveViolet)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
      <line x1="302" y1="367" x2="302" y2="402" stroke="url(#mWaveViolet)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
    </g>

    <!-- Central Sonic Singularity Node -->
    <circle cx="256" cy="256" r="30" fill="#020617" stroke="url(#mWaveCyan)" stroke-width="5"/>
    <circle cx="256" cy="256" r="16" fill="#22d3ee"/>
    <circle cx="256" cy="256" r="7" fill="#ffffff"/>
  </g>
</svg>
